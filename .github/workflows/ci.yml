# Runs on every push and pull request: the same checks as "Verification" in README.md.
# Versions match the Docker images (node:22-alpine, php:8.4-cli), so CI and local dev agree.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: localhost:5180,127.0.0.1:5180,localhost:8010,127.0.0.1:8010
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Addresses are encrypted, so tests need an app key; a fresh one per run is fine.
      - run: cp .env.example .env && php artisan key:generate --ansi
      - run: php artisan test
