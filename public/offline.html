<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9f8" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · AYOS</title>
    <!-- Shown by sw.js when a page can't load. It must work with no internet: no fonts or stylesheets to fetch. -->
    <style>
      :root {
        --ink: #18232b;
        --text: #4f5b63;
        --canvas: #e7f1f8;
        --line: #d6e4ee;
        --sky: #1682bd;
        --orange: #c84f19;
        --orange-hover: #b2441a;
        --white: #fff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--canvas);
        color: var(--ink);
        font: 400 1rem / 1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--white);
        box-shadow: 0 18px 55px rgb(29 56 68 / 9%);
        text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 16px 0 8px; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--text); }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--orange);
        color: var(--white);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--orange-hover); }
      button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
      small { display: block; margin-top: 16px; color: var(--text); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="AYOS" />
      <h1>You’re offline</h1>
      <p>AYOS needs an internet connection to load your requests and messages. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" id="retry">Try again</button>
      <small role="status" id="status"></small>
    </main>
    <script>
      const retry = () => location.reload()
      document.getElementById('retry').addEventListener('click', retry)
      // Comes back by itself as soon as the connection returns.
      addEventListener('online', () => {
        document.getElementById('status').textContent = 'Back online. Loading…'
        retry()
      })
    </script>
  </body>
</html>
