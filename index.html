<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AYOS — Find Trusted Local Service Professionals</title>
    <meta
      name="description"
      content="Find trusted local electricians, plumbers, technicians, and other service professionals 
      with AYOS. Discover local help for your home and everyday needs." />
    <meta name="author" content="AYOS" />
    <meta name="application-name" content="AYOS" />
    <meta name="theme-color" content="#f8f9f8" />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://my-domain.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AYOS" />
    <meta property="og:title" content="AYOS — Find Trusted Local Service Professionals" />
    <meta property="og:description" content="Find trusted local electricians, plumbers, technicians, and other service professionals with AYOS." />
    <meta property="og:url" content="https://my-domain.com/" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:image" content="https://my-domain.com/images/ayos-social-preview.jpg" />
    <meta property="og:image:alt" content="AYOS — trusted local service professionals"/>
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AYOS — Find Trusted Local Service Professionals" />
    <meta name="twitter:description" content="Find trusted local electricians, plumbers, technicians, and other service professionals with AYOS." />
    <meta name="twitter:image" content="https://my-domain.com/images/ayos-social-preview.jpg" />

    <!-- Favicons: add files to public/ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://my-domain.com/#organization",
            "name": "AYOS",
            "url": "https://my-domain.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://my-domain.com/images/ayos-logo.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://my-domain.com/#website",
            "url": "https://my-domain.com/",
            "name": "AYOS",
            "description": "Find trusted local service professionals for home and everyday needs.",
            "inLanguage": "en-PH",
            "publisher": {
              "@id": "https://my-domain.com/#organization"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
