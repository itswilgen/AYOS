# AYOS production: Caddy (HTTPS + React app) → two PHP-FPM containers (Laravel), load-balanced → PostgreSQL,
# plus Redis (cache, sessions, rate-limit counters) and Reverb for live chat.
# Settings and secrets come from .env next to this file (copy deploy/.env.production.example).
# Only Caddy is reachable from outside, on ports 80 and 443. See deploy/RUNBOOK.md.
name: ayos-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Laravel settings that follow from the domain; everything secret stays in .env.
x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
  FRONTEND_URL: https://${DOMAIN}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ayos
  DB_USERNAME: ayos
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  SESSION_DOMAIN: ""
  SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  # Redis holds the cache (database 1) and sessions (database 0), shared by both PHP containers, so a
  # person stays signed in whichever container answers, and rate limits count across both.
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${DOMAIN}
  GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback

x-backend: &backend
  image: ayos-backend:prod
  restart: unless-stopped
  env_file: ${AYOS_ENV_FILE:-.env}
  environment: *laravel-env
  volumes:
    # Every uploaded file: public ones (photos, covers) and private ones (ID documents, request and chat photos).
    # Both containers share this volume (same server), so either one can serve any file.
    - uploads:/var/www/html/storage/app
  # Asks PHP-FPM itself for its ping page ("pong"), so "healthy" means it can take requests.
  healthcheck:
    test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ayos
      POSTGRES_USER: ayos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayos -d ayos"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Saved to disk (appendonly), so a restart doesn't sign everyone out. 256 MB is plenty for this size;
    # when full, Redis drops the least-used keys that have an expiry (cache, sessions, counters all do).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # Two identical PHP containers. Caddy spreads requests across them and skips one that is down, and
  # deploy.sh restarts them one at a time, so a crash or a deploy doesn't take the site offline.
  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

  backend-2:
    <<: *backend

  reverb:
    image: ayos-backend:prod
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ${AYOS_ENV_FILE:-.env}
    environment: *laravel-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    logging: *logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND_URL: https://${DOMAIN}
        VITE_API_BASE_URL: https://${DOMAIN}/api
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?Set VITE_RECAPTCHA_SITE_KEY in .env}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
        VITE_REVERB_HOST: ${DOMAIN}
    image: ayos-web:prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Only the public uploads folder, read-only: Caddy never sees ID documents or chat photos.
      - type: volume
        source: uploads
        target: /srv/files/storage
        read_only: true
        volume:
          subpath: public
    depends_on:
      - backend
      - backend-2
      - reverb
    logging: *logging

volumes:
  pgdata:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
