# AYOS production: Caddy (HTTPS + React app) → PHP-FPM (Laravel) → PostgreSQL, plus Reverb for live chat.
# Settings and secrets come from .env next to this file (copy deploy/.env.production.example).
# Only Caddy is reachable from outside, on ports 80 and 443. See deploy/RUNBOOK.md.
name: ayos-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Laravel settings that follow from the domain; everything secret stays in .env.
x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
  FRONTEND_URL: https://${DOMAIN}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ayos
  DB_USERNAME: ayos
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  SESSION_DOMAIN: ""
  SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${DOMAIN}
  GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ayos
      POSTGRES_USER: ayos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayos -d ayos"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ayos-backend:prod
    restart: unless-stopped
    env_file: ${AYOS_ENV_FILE:-.env}
    environment: *laravel-env
    volumes:
      # Every uploaded file: public ones (photos, covers) and private ones (ID documents, request and chat photos).
      - uploads:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  reverb:
    image: ayos-backend:prod
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: ${AYOS_ENV_FILE:-.env}
    environment: *laravel-env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    logging: *logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND_URL: https://${DOMAIN}
        VITE_API_BASE_URL: https://${DOMAIN}/api
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:?Set VITE_RECAPTCHA_SITE_KEY in .env}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
        VITE_REVERB_HOST: ${DOMAIN}
    image: ayos-web:prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Only the public uploads folder, read-only: Caddy never sees ID documents or chat photos.
      - type: volume
        source: uploads
        target: /srv/files/storage
        read_only: true
        volume:
          subpath: public
    depends_on:
      - backend
      - reverb
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
