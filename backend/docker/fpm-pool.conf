; Sized for a 2–4 GB VPS running TWO of these containers: each PHP worker uses roughly 40–60 MB,
; so 2 × 8 workers stay under about 1 GB in the worst case.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Health check: Docker asks PHP-FPM itself for /fpm-ping (answers "pong"), without going through Laravel.
ping.path = /fpm-ping
ping.response = pong
