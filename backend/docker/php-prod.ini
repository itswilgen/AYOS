; AYOS production PHP settings (on top of php.ini-production).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 5M
post_max_size = 30M
max_file_uploads = 10

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside a running container, so skip file checks.
opcache.validate_timestamps = 0
